seed: 42
device: "cuda"  # fallback to cpu automatically if cuda unavailable or OOM

features:
  track: "sel"  # "sel" (Track A, 48 features) or "pca" (Track B, 27 features)
  schema_path: "fedbank_schema_v1.json"
  processed_dir: "data/processed"

edges:
  similarity:
    enabled: true
    threshold: 0.8
    max_per_node: 5
    chunk_size: 1024
  
  temporal:
    enabled: true
    window_s: 7200
    max_per_node: 5

  cluster:
    enabled: true
    n_clusters: 3
    batch_size: 1024
    max_per_node: 5
    max_edges_per_cluster: 10000
    model_artifact_path: "artifacts/graph/kmeans.joblib"

  anomaly:
    enabled: true
    k_features: 2
    similarity_threshold: 0.75
    max_per_node: 3

smote:
  enabled: false

validation:
  max_isolated_frac: 0.10
  degree_hard_cap: 200

targets:
  train_edges: 3170000
  val_edges: 641000
  test_edges: 644000
  monitor_edges: 1810000
